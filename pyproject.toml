[project]
name = "hackdb"
version = "0.1.0"
authors = [
    { name="the big rat enthusiasts" }
]
description = "an unofficial library to interact with hackdb"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "Unlicense"
license-files = ["LICENSE"]
dependencies = [
    "requests~=2.34.2"
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    ".idea/*",
    ".github/*",
]
